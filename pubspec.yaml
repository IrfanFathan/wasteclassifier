name: wasteclassifier
description: "A real-time waste classifier using your own Teachable Machine TFLite model."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  camera: ^0.10.5+9
  tflite_flutter: ^0.12.0
  image: ^4.1.7
  file_picker: ^8.0.0+1
  path_provider: ^2.1.2
  path: ^1.9.0
  shared_preferences: ^2.2.2
  flutter_colorpicker: ^1.0.3
  archive: ^4.0.0
  google_fonts: ^8.0.2
  http: ^1.6.0
  supabase_flutter: ^2.12.0
  geolocator: ^14.0.2
  flutter_background_service: ^5.1.0
  go_router: ^17.1.0
  shelf: ^1.4.2
  device_info_plus: ^12.3.0
  flutter_riverpod: ^3.3.1
  riverpod: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
